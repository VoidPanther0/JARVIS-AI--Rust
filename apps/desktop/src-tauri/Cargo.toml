[package]
name = "jarvis-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "JARVIS desktop application (Tauri)."
default-run = "jarvis-desktop"

[lib]
name = "jarvis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "jarvis-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jarvis-core.workspace = true
jarvis-ai.workspace = true
jarvis-memory.workspace = true
jarvis-platform.workspace = true
tauri = { version = "2", features = [] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
