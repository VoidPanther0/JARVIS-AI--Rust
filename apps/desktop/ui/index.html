<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <span class="app__brand">JARVIS</span>
      <span class="app__version" id="version">v0.1.0-alpha.1</span>
    </header>

    <section class="chat" id="chat">
      <div class="chat__message chat__message--assistant">
        Hello. I'm JARVIS, running locally. Ask me something to see the
        current (placeholder) AI provider respond.
      </div>
    </section>

    <form class="composer" id="composer">
      <input
        class="composer__input"
        id="prompt"
        type="text"
        placeholder="Message JARVIS..."
        autocomplete="off"
      />
      <button class="composer__send" type="submit">Send</button>
    </form>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
